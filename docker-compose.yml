services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - workflow_checkpoints:/app/data/checkpoints
    environment:
      MANGAFLOW_CHECKPOINT_DIR: /app/data/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  studio:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  workflow_checkpoints:
